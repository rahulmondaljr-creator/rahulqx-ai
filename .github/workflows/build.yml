name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Get Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O g.zip
          unzip -q g.zip
      - name: Build APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rahul-qx-ai-apk
          path: build/outputs/apk/debug/app-debug.apk
